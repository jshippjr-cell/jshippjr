[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chordential-oia"
version = "0.1.0"
description = "Opportunity Intelligence Agent for Chordential - finds and ranks opportunities Chordential can win."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Chordential" }]
keywords = ["music", "opportunities", "rfp", "procurement", "scoring", "agent"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.24"]
web = ["fastapi>=0.110", "uvicorn>=0.23", "jinja2>=3.1", "python-multipart>=0.0.6"]
# Web Push (native iOS/desktop notifications for the installed PWA). Isolated so
# the core never hard-depends on it; imported lazily, only when actually sending
# (Render-only — sandbox/CI egress is blocked and mocks the sender).
push = ["pywebpush>=1.14"]

[project.scripts]
chordential-oia = "chordential_oia.cli:main"
chordential-web = "chordential_oia.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"chordential_oia.web" = [
    "templates/*.html",
    "templates/public/*.html",
    "static/*.css",
    "static/*.js",
    "static/*.png",
    "static/*.svg",
    "static/*.ico",
    "static/public/*.css",
    "static/public/*.png",
    "static/public/*.jpg",
    "static/public/*.svg",
    "static/public/*.webp",
    "static/public/*.mp4",
    "static/public/*.webm",
    "static/public/*.mp3",
    "static/public/*.wav",
    "static/public/img/*.jpg",
    "static/public/img/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chordential-oia"
version = "0.1.0"
description = "Opportunity Intelligence Agent for Chordential - finds and ranks opportunities Chordential can win."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Chordential" }]
keywords = ["music", "opportunities", "rfp", "procurement", "scoring", "agent"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.24", "pytest-xdist>=3.0"]
# pywebpush ships with the web stack: native phone alerts are a web-app feature,
# and bundling it here means it installs on any deploy that runs the web app —
# regardless of whether the build command remembers the separate "push" extra.
# It's still imported lazily (only when actually sending), so a CLI-only install
# or an egress-blocked sandbox never touches it; tests mock the sender.
web = ["fastapi>=0.110", "uvicorn>=0.23", "jinja2>=3.1", "python-multipart>=0.0.6", "pywebpush>=1.14"]
# Retained for back-compat with existing build commands that say ".[web,push]".
push = ["pywebpush>=1.14"]
# Phase B1 — agentic Gmail triage. All optional and lazily imported, so the core
# app, CI, and the sandbox never depend on them; only a deploy that runs triage
# (or the MCP server) needs them installed.
gmail = ["google-api-python-client>=2.0", "google-auth>=2.0"]
ai = ["anthropic>=0.40"]
# ADR-0043 — durable object storage (Cloudflare R2 / S3 / MinIO). Lazily imported
# by the s3 backend only, so an instance left on the local disk never needs it.
s3 = ["boto3>=1.34"]
mcp = ["mcp>=1.2"]
# Live payments. Imported lazily inside payments/stripe.py, so the app/CI/sandbox
# never depend on it; only a deploy running live Stripe payments installs it.
stripe = ["stripe>=7.0"]
# Managed Postgres (production). Imported lazily in db.connect() only when
# CHORDENTIAL_DB is a postgres:// URL, so dev/tests/CI stay on SQLite with no driver.
# Removing the SQLite-on-disk dependency is what unlocks zero-downtime deploys.
postgres = ["psycopg[binary,pool]>=3.1"]
# Veo video generation for the capabilities film (scripts/gen_capabilities_film.py).
# Standalone tooling, imported lazily inside the script, so the app/CI/sandbox
# never depend on it — only a machine actually generating clips installs it.
veo = ["google-genai>=0.3"]
# PDF export of discovery findings (scripts/export_agency_spotter_pdf.py).
# Imported lazily inside the renderer, so the app/CI/sandbox never depend on it —
# only a machine actually producing the report installs it.
pdf = ["reportlab>=4.0"]

[project.scripts]
chordential-oia = "chordential_oia.cli:main"
chordential-web = "chordential_oia.web.app:main"
chordential-gmail-mcp = "chordential_oia.mcp.gmail_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"chordential_oia.web" = [
    "templates/*.html",
    "templates/public/*.html",
    "data/*.json",
    "static/*.css",
    "static/*.js",
    "static/*.png",
    "static/*.svg",
    "static/*.ico",
    "static/public/*.css",
    "static/public/*.js",
    "static/public/*.png",
    "static/public/*.jpg",
    "static/public/*.svg",
    "static/public/*.webp",
    "static/public/*.mp4",
    "static/public/*.webm",
    "static/public/*.mp3",
    "static/public/*.wav",
    "static/public/*.pdf",
    # The notation world ships its scene as data beside the renderer rather than
    # inlined in the page: 65 KB of JSON offsets and the raw float buffer. Without
    # these two the page renders a blank cream rectangle that looks deliberate.
    "static/public/*.json",
    "static/public/*.bin",
    "static/public/img/*.jpg",
    "static/public/img/*.png",
    # These globs are setuptools', not shell: * stops at a directory separator, so
    # "static/public/*.js" does NOT reach a subdirectory. three.min.js was committed
    # and served fine in dev (where StaticFiles reads the source tree) while never
    # being installed — so /commission 404'd on it in production and rendered with
    # no 3D layer at all. A new asset subdirectory needs its own line here.
    "static/public/vendor/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Run the suite in parallel (pytest-xdist). Cuts ~170s → ~70s; the tests are
# isolated (per-test tmp DBs/upload dirs), so this is safe. Override with `-n0`
# for serial debugging of a single failure.
addopts = "-n auto"

# Render deployment blueprint for the Chordential app.
# Render reads this automatically: it builds from GitHub (no local machine needed)
# and redeploys on every push to the branch below, so the live link always shows
# the latest. Starter plan with a persistent disk mounted at /var/data: the SQLite
# DB lives on the disk (CHORDENTIAL_DB below), so inbound leads and pipeline data
# survive deploys and restarts. A paid instance also stays always-on (no cold start).
#
# NOTE: a persistent disk requires a paid instance — that's why plan is "starter"
# (not "free"). Render will prompt to confirm the paid upgrade when this syncs.
services:
  - type: web
    name: chordential
    runtime: python
    plan: starter
    branch: claude/admiring-mayer-u241h5
    buildCommand: "pip install '.[web,gmail,ai,stripe,postgres]'"
    startCommand: "uvicorn chordential_oia.web.app:app --host 0.0.0.0 --port $PORT"
    autoDeploy: true
    # Render switches traffic to a new instance only after this returns 200. Once
    # the disk is removed at cutover (see docs/zero-downtime-cutover.md) Render runs
    # the new instance alongside the old → true zero-downtime, blue-green deploys.
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # SQLite DB path on the mounted persistent disk (see disk: below). Keeping the
      # DB here is what makes real data persist across deploys. The admin passphrase
      # (CHORDENTIAL_ADMIN_TOKEN) is set in the Render dashboard, not committed here.
      - key: CHORDENTIAL_DB
        value: "/var/data/chordential.db"
      # Master switch for live fetching. When set, the crawler actually pulls +
      # parses pages (results land in the review queue) AND the in-process
      # background auto-fetcher runs, scanning your On sources on a schedule.
      # The human gate still applies: only Approved targets are ever fetched.
      # Optional knobs (defaults shown): CHORDENTIAL_AUTOFETCH=1 (set 0 for manual
      # only), CHORDENTIAL_AUTOFETCH_INTERVAL=900 (seconds), CHORDENTIAL_REFETCH_HOURS=12.
      - key: CHORDENTIAL_ENABLE_SCRAPE
        value: "1"
      # Autonomous engines: enrich / re-enrich / decision-makers / intelligence /
      # signals / scoring run on their own in the background. SAFE on this small
      # instance because every live-fetch job runs in its own KILLABLE worker
      # process with a per-agency timeout — a hostile page can't freeze the server
      # or stall the queue (it's killed, marked, and skipped). Set "0" to disable.
      - key: CHORDENTIAL_AUTONOMOUS
        value: "1"
      # Campaign Workspace (Creative OS) — the campaign is the workspace root that
      # elevates a project into "one screen, one campaign, everything" (creative
      # timeline + structured creative direction; more per docs/campaign-workspace-prd.md).
      # Dogfooded in prod: the code now defaults this ON (so it deploys reliably even
      # if Render doesn't re-apply this env var); this line is explicit belt-and-braces.
      # Admin-gated — only the operator sees it. Additive + lazy (campaigns created on
      # first open), so it never disturbs existing projects/delivery. Set "0" to hide.
      - key: CHORDENTIAL_CAMPAIGN_WORKSPACE
        value: "1"
      # Web Push (native phone alerts for the installed PWA). The VAPID keypair
      # and subject are set in the Render dashboard (the private key is a secret),
      # NOT committed here: CHORDENTIAL_VAPID_PUBLIC, CHORDENTIAL_VAPID_PRIVATE,
      # CHORDENTIAL_VAPID_SUBJECT (a mailto:). Optional: CHORDENTIAL_DISCOVERY_CALL_URL.
      #
      # ── Outbound email (transactional) ──────────────────────────────────────
      # Powers every outbound send: the website-intake acknowledgment, outreach
      # "Send now", crew broadcasts, and recruiting invites. Until these are set
      # the mailer is a safe no-op (logs intent, sends nothing) — mail_configured()
      # needs provider=smtp AND host AND from before anything leaves the server.
      #
      # Recommended: a transactional provider (Postmark / Resend / SendGrid) over
      # its SMTP endpoint, with SPF/DKIM on chordential.com so mail lands in the
      # inbox, not spam. Set the four secrets (HOST/USER/PASS/FROM) in the Render
      # dashboard, then flip PROVIDER to "smtp" LAST to turn sending on.
      # These declarations carry no values — sync:false means "managed in the
      # dashboard, never synced from git" (no secret ever lives in the repo).
      - key: CHORDENTIAL_MAIL_PROVIDER   # set to "smtp" to enable sending
        sync: false
      - key: CHORDENTIAL_SMTP_HOST       # e.g. smtp.postmarkapp.com / smtp.resend.com
        sync: false
      - key: CHORDENTIAL_SMTP_PORT
        value: "587"
      - key: CHORDENTIAL_SMTP_USER       # provider's SMTP username / API-key id
        sync: false
      - key: CHORDENTIAL_SMTP_PASS       # provider's SMTP password / API key (secret)
        sync: false
      - key: CHORDENTIAL_SMTP_FROM       # verified sender, e.g. hello@chordential.com
        sync: false
    # ⚠️ ZERO-DOWNTIME CUTOVER: this disk is what blocks zero-downtime deploys
    # (single-attach). At cutover, REMOVE this disk block and the CHORDENTIAL_DB
    # value above, add a Render Postgres `databases:` block + a fromDatabase env,
    # AFTER migrating the data. Do NOT remove the disk before the data migration —
    # see docs/zero-downtime-cutover.md for the exact, safe order.
    disk:
      name: chordential-data
      mountPath: /var/data
      sizeGB: 1

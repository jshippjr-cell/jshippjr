# Render deployment blueprint for the Chordential app.
# Render reads this automatically: it builds from GitHub (no local machine needed)
# and redeploys on every push to the branch below, so the live link always shows
# the latest. Starter plan with a persistent disk mounted at /var/data: the SQLite
# DB lives on the disk (CHORDENTIAL_DB below), so inbound leads and pipeline data
# survive deploys and restarts. A paid instance also stays always-on (no cold start).
#
# NOTE: a persistent disk requires a paid instance — that's why plan is "starter"
# (not "free"). Render will prompt to confirm the paid upgrade when this syncs.
services:
  - type: web
    name: chordential
    runtime: python
    plan: starter
    branch: claude/admiring-mayer-u241h5
    buildCommand: "pip install '.[web]'"
    startCommand: "uvicorn chordential_oia.web.app:app --host 0.0.0.0 --port $PORT"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # SQLite DB path on the mounted persistent disk (see disk: below). Keeping the
      # DB here is what makes real data persist across deploys. The admin passphrase
      # (CHORDENTIAL_ADMIN_TOKEN) is set in the Render dashboard, not committed here.
      - key: CHORDENTIAL_DB
        value: "/var/data/chordential.db"
      # Master switch for live fetching. When set, an Approved crawl target that is
      # fetched actually pulls + parses the page (results land in the review queue).
      # The human gate still applies: only Approved targets are ever fetched.
      - key: CHORDENTIAL_ENABLE_SCRAPE
        value: "1"
    disk:
      name: chordential-data
      mountPath: /var/data
      sizeGB: 1

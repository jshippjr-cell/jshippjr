<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chordential — from brief to cleared master</title>
<style>
  :root{
    --cream:#f4ecdf; --sand:#e6d4b5; --olive:#8a8a5c; --slate:#6d7f88;
    --ink:#241f1b; --wine:#44161e; --orange:#e4671f; --white:#fff;
    --font: "Georgia", "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:auto}
  body{background:var(--cream);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}

  /* ---- Hero intro ---- */
  .intro{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;position:relative}
  .intro h1{font-family:var(--font);font-weight:400;font-size:clamp(2.4rem,6vw,5rem);line-height:1.05;letter-spacing:-.01em;max-width:14ch}
  .intro .accent{color:var(--orange)}
  .intro p{margin-top:1.4rem;font-size:clamp(1rem,2.2vw,1.25rem);color:var(--slate);max-width:42ch}
  .scrollcue{position:absolute;bottom:2.2rem;left:50%;transform:translateX(-50%);font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:var(--olive);opacity:.8}
  .scrollcue::after{content:"";display:block;width:1px;height:34px;margin:.6rem auto 0;background:linear-gradient(var(--olive),transparent);animation:cue 1.8s ease-in-out infinite}
  @keyframes cue{0%,100%{opacity:.3;transform:scaleY(.6)}50%{opacity:1;transform:scaleY(1)}}

  /* ---- Scroll stage ---- */
  .sw{position:relative}
  .stage{position:sticky;top:0;height:100vh;overflow:hidden}
  .scenes{position:absolute;inset:0}
  .scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;will-change:opacity,transform}
  .scene img{width:min(92vw,1100px);height:auto;max-height:82vh;object-fit:contain;filter:drop-shadow(0 30px 60px rgba(68,22,30,.14));will-change:transform}

  /* ---- Copy ---- */
  .copylayer{position:absolute;left:0;right:0;bottom:0;padding:clamp(1.4rem,5vw,4rem);pointer-events:none}
  .copylayer::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent,rgba(244,236,223,.0) 8%,rgba(244,236,223,.72) 55%,var(--cream));z-index:-1}
  .copy{position:absolute;left:clamp(1.4rem,5vw,4rem);right:clamp(1.4rem,5vw,4rem);bottom:clamp(1.6rem,6vw,4.2rem);max-width:40ch;opacity:0;transform:translateY(14px);will-change:opacity,transform}
  .copy .eyebrow{font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--orange);font-weight:600;margin-bottom:.7rem}
  .copy h2{font-family:var(--font);font-weight:400;font-size:clamp(1.8rem,4.4vw,3.2rem);line-height:1.08;letter-spacing:-.01em;color:var(--ink)}
  .copy p{margin-top:.9rem;font-size:clamp(1rem,1.6vw,1.15rem);line-height:1.55;color:var(--wine)}
  .tags{margin-top:1.1rem;display:flex;flex-wrap:wrap;gap:.5rem}
  .tags span{font-size:.76rem;letter-spacing:.02em;padding:.32rem .7rem;border:1px solid rgba(68,22,30,.22);border-radius:100px;color:var(--wine)}
  .cta{margin-top:1.4rem;display:inline-block;pointer-events:auto;background:var(--orange);color:#fff;font-weight:600;font-size:1rem;padding:.85rem 1.6rem;border-radius:100px;text-decoration:none;box-shadow:0 10px 24px rgba(228,103,31,.3)}

  /* ---- Progress rail ---- */
  .rail{position:fixed;right:clamp(.9rem,2vw,1.8rem);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:.8rem;z-index:10}
  .rail button{width:10px;height:10px;border-radius:50%;border:1.5px solid rgba(68,22,30,.35);background:transparent;padding:0;cursor:pointer;transition:.3s}
  .rail button[aria-current="true"]{background:var(--orange);border-color:var(--orange);transform:scale(1.25)}
  .wordmark{position:fixed;top:clamp(1rem,3vw,1.8rem);left:clamp(1.2rem,4vw,2.4rem);font-family:var(--font);font-size:1.15rem;letter-spacing:.02em;z-index:10;color:var(--ink)}
  .wordmark b{color:var(--orange);font-weight:400}

  @media (max-width:700px){
    .copy{max-width:none}
    .rail{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .scene img{transform:none!important}
    .scrollcue::after{animation:none}
  }
</style>
</head>
<body>
  <div class="wordmark">Chord<b>ential</b></div>

  <header class="intro">
    <h1>Original music for campaigns.<br><span class="accent">Composed. Cleared. Delivered.</span></h1>
    <p>Scroll to travel from the brief to the final, cleared master — the way the work actually moves.</p>
    <div class="scrollcue">Scroll</div>
  </header>

  <section class="sw" id="sw">
    <div class="stage">
      <div class="scenes" id="scenes"></div>
      <div class="copylayer"><div id="copy"></div></div>
    </div>
  </section>

  <nav class="rail" id="rail" aria-label="Sections"></nav>

<script>
const SCENES = [
  { still:"stills/scene1.png", eyebrow:"The problem",
    title:"Every campaign starts with a creative brief.",
    body:"An agency has a campaign. Pressure, a deadline, expectation — not chaos, just the quiet weight of delivering something that matters.",
    tags:["The brief","The deadline"] },
  { still:"stills/scene2.png", eyebrow:"Why Chordential",
    title:"We assemble the right creative team for the work.",
    body:"Not a marketplace. Not AI. The right composers and creative leads, brought together with intention — a creative network built around the work.",
    tags:["Creative network","By intention"] },
  { still:"stills/scene3.png", eyebrow:"The craft",
    title:"Original music begins with people — not prompts.",
    body:"Hands on keys. Notation. Strings. This is where ideas become music — and where you remember we're a music company.",
    tags:["Original composition","Human-made"] },
  { still:"stills/scene4.png", eyebrow:"The payoff",
    title:"Built to survive approval.",
    body:"Agencies don't celebrate delivery — they celebrate approval. The client smiles, the creative director signs off, the producer exhales. Everything aligned.",
    tags:["Client-ready","Aligned"] },
  { still:"stills/scene5.png", eyebrow:"The infrastructure",
    title:"Everything arrives organized, cleared, and ready.",
    body:"Stems, versions, cue sheets, rights — packaged and delivered. The quiet machine that makes it all feel effortless.",
    tags:["Cleared","Organized","Delivered"] },
  { still:"stills/scene6.png", eyebrow:"",
    title:"The music, living where it belongs.",
    body:"The campaign. The film. The audience. Original music for campaigns — composed, cleared, delivered.",
    tags:[], cta:"Start a project" },
];
const DWELL = 1.15; // viewport-heights of scroll per scene

const scenesEl = document.getElementById('scenes');
const copyEl = document.getElementById('copy');
const railEl = document.getElementById('rail');
const sw = document.getElementById('sw');

SCENES.forEach((s,i)=>{
  const fig=document.createElement('figure'); fig.className='scene'; fig.dataset.i=i;
  const img=new Image(); img.src=s.still; img.alt=s.title; img.loading = i<2?'eager':'lazy';
  img.onerror=()=>{ img.style.display='none'; fig.classList.add('noimg'); }; // graceful if a still is missing
  fig.appendChild(img); scenesEl.appendChild(fig);

  const c=document.createElement('div'); c.className='copy'; c.dataset.i=i;
  c.innerHTML = (s.eyebrow?`<div class="eyebrow">${s.eyebrow}</div>`:'')
    + `<h2>${s.title}</h2><p>${s.body}</p>`
    + (s.tags&&s.tags.length?`<div class="tags">${s.tags.map(t=>`<span>${t}</span>`).join('')}</div>`:'')
    + (s.cta?`<a class="cta" href="#">${s.cta}</a>`:'');
  copyEl.appendChild(c);

  const b=document.createElement('button'); b.setAttribute('aria-label',s.title);
  b.addEventListener('click',()=>{ const total=SCENES.length*DWELL*innerHeight-innerHeight; window.scrollTo({top:sw.offsetTop + (i/(SCENES.length-1))*total, behavior:'smooth'}); });
  railEl.appendChild(b);
});

sw.style.height = (SCENES.length*DWELL*100)+'vh';
const figs=[...scenesEl.children], copies=[...copyEl.children], dots=[...railEl.children];
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;

let target=0, cur=0, ticking=false;
function onScroll(){ if(!ticking){ticking=true;requestAnimationFrame(update);} }
function update(){
  ticking=false;
  const vh=window.innerHeight;
  const total=SCENES.length*DWELL*vh - vh;
  const p=Math.max(0,Math.min(1,(window.scrollY - sw.offsetTop)/total)); // 0..1 across whole stage
  const fpos=p*(SCENES.length-1); // floating scene position
  const active=Math.round(fpos);
  const BAND=0.16; // half-width of the quick crossfade around each boundary
  const zone=(ad)=> ad<=0.5-BAND ? 1 : (ad>=0.5+BAND ? 0 : (0.5+BAND-ad)/(2*BAND));
  figs.forEach((fig,i)=>{
    const d=Math.abs(fpos-i);
    fig.style.opacity=zone(d).toFixed(3);   // hold crisp, cross quickly
    if(!reduce){
      const img=fig.firstChild;
      const scale=1.03+0.05*(1-Math.min(1,d)); // subtle ken-burns toward center
      const drift=(fpos-i)*-16;
      img.style.transform=`scale(${scale}) translateY(${drift}px)`;
    }
  });
  copies.forEach((c,i)=>{
    const op=zone(Math.abs(fpos-i));
    c.style.opacity=op.toFixed(3);
    c.style.transform=`translateY(${(1-op)*14}px)`;
  });
  dots.forEach((b,i)=>b.setAttribute('aria-current', i===active?'true':'false'));
}
addEventListener('scroll',onScroll,{passive:true});
addEventListener('resize',onScroll);
update();

// QA helper: ?scene=N jumps to that scene on load
const qs=new URLSearchParams(location.search).get('scene');
if(qs!==null){ const i=Math.max(0,Math.min(SCENES.length-1,+qs)); const total=SCENES.length*DWELL*innerHeight-innerHeight; window.scrollTo(0, sw.offsetTop + (i/(SCENES.length-1))*total); update(); }
</script>
</body>
</html>

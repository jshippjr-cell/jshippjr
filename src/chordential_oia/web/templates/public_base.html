<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Chordential{% endblock %} · Chordential</title>
  <link rel="icon" href="/static/logo.png">
  <link rel="stylesheet" href="/static/public/site.css">
</head>
<body class="pub">
<header class="pub-header">
  <div class="pub-header-inner">
    <a class="pub-brand" href="/site" aria-label="Chordential">
      <img src="/static/public/wordmark-ko.png" alt="Chordential">
    </a>
    <input type="checkbox" id="pub-menu-toggle" class="m-toggle">
    <label for="pub-menu-toggle" class="m-burger" aria-label="Menu">☰</label>
    <nav class="pub-nav">
      <a href="/site#work" class="{{ 'active' if active=='home' }}">Work</a>
      <a href="/site/capabilities" class="{{ 'active' if active=='capabilities' }}">Approach</a>
      <a href="/site#about">About</a>
      <a class="pub-cta" href="/site/start">Start a conversation</a>
    </nav>
  </div>
</header>

<main class="pub-main">
  {% block content %}{% endblock %}
</main>

<footer class="pub-footer">
  <div class="pub-footer-inner">
    <a class="pub-footer-brand" href="/site">
      <img src="/static/public/wordmark-ko.png" alt="Chordential">
    </a>
    <span class="pub-footer-tag">Original music, sound &amp; sonic identity for campaigns.</span>
    <span class="pub-footer-links">
      <a href="/site/capabilities">Approach</a>
      <a href="/site/samples">Work</a>
      <a href="/site/start">Start a project</a>
      <a href="/site/book">Book a call</a>
      <a href="/site/apply">Create with us</a>
    </span>
  </div>
</footer>
</body>
</html>

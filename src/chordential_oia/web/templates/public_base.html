<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Chordential{% endblock %} · Chordential</title>
  <link rel="icon" href="/static/public/wordmark-dark.png">
  <link rel="stylesheet" href="/static/public/site.css?v=14">
</head>
<body class="pub">
<header class="pub-header">
  <div class="pub-header-inner">
    <a class="pub-brand" href="/" aria-label="Chordential">
      <img src="/static/public/wordmark-ko.png" alt="Chordential">
    </a>
    <input type="checkbox" id="pub-menu-toggle" class="m-toggle">
    <label for="pub-menu-toggle" class="m-burger" aria-label="Menu">☰</label>
    <nav class="pub-nav">
      <a href="/#work" class="{{ 'active' if active=='home' }}">Work</a>
      <a href="/capabilities" class="{{ 'active' if active=='capabilities' }}">Approach</a>
      <a href="/#about">About</a>
      <a class="pub-cta" href="/start">Start a conversation</a>
    </nav>
  </div>
</header>

<main class="pub-main">
  {% block content %}{% endblock %}
</main>

<footer class="pub-footer">
  <div class="pub-footer-inner">
    <a class="pub-footer-brand" href="/">
      <img src="/static/public/wordmark-ko.png" alt="Chordential">
    </a>
    <span class="pub-footer-tag">Original music, sound &amp; sonic identity for campaigns.</span>
    <span class="pub-footer-links">
      <a href="/capabilities">Approach</a>
      <a href="/samples">Capability demos</a>
      <a href="/reel">The Reel</a>
      <a href="/start">Start a project</a>
      <a href="/book">Book a call</a>
      <a href="/for-artists">For creators</a>
      <a href="/apply">Create with us</a>
    </span>
  </div>
</footer>
<script>
(function(){
  // iOS often ignores the autoplay attribute; nudge the muted hero to play inline.
  var hero = document.querySelector('video.hero-video');
  if(hero){ hero.muted = true; var hp = hero.play(); if(hp && hp.catch){ hp.catch(function(){}); } }
  // Only one demo track at a time: starting one pauses any other that's playing.
  var auds = Array.prototype.slice.call(document.querySelectorAll('audio'));
  auds.forEach(function(a){
    a.addEventListener('play', function(){
      auds.forEach(function(o){ if(o !== a && !o.paused){ o.pause(); } });
    });
  });
})();
</script>
</body>
</html>

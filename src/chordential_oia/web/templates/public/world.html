<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chordential — From a spark to a delivered score</title>
<meta name="description" content="Scroll to fly through the making of an original score — brief to estimate to session to clearance to delivery.">
<link rel="icon" href="/static/public/wordmark-dark.png">
<style>
/* THE WORLD — scroll-scrubbed camera flight through the client journey.
   Content: the handcrafted papercraft-world film; chrome stays quiet and
   themes to the film's own paper + Chordential ink/ember. The film is one
   continuous take sliced at beat boundaries, so every seam is frame-locked. */
:root, .sw-root {
  --sw-bg: #E9E2D2;             /* the film's paper ground */
  --sw-ink: #2E1B14;
  --sw-ink-soft: #6d5f52;
  --sw-accent: #E4671F;         /* ember — per-section accents override */
  --sw-font-display: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
}
html,body{margin:0;background:var(--sw-bg)}
/* small screens: the copy block runs tall — drop the scroll hint so it never
   collides with the tag pills (the first flick dismisses it anyway) */
@media (max-width: 640px){ .sw-root .sw-hint{ display:none } }
</style>
</head>
<body>
<div id="top"></div>
<div id="world"></div>

<script src="/static/public/world/scrub-engine.js?v={{ asset_v }}"></script>
<script>
/* h264 is the shipping codec; a browser without it (rare) gets the VP9 webm twins */
var H264 = document.createElement('video').canPlayType('video/mp4; codecs="avc1.64001f"');
var V = '?v={{ asset_v }}';   /* cache-buster: new film releases must not serve stale */
function CLIP(n){ return '/static/public/world/leg' + n + (H264 ? '.mp4' : '.webm') + V; }
function STILL(n){ return '/static/public/world/still' + n + '.jpg' + V; }
mountScrollWorld(document.getElementById('world'), {
  brand: { name: 'Chordential', href: '#top' },
  hint: 'scroll to begin the score',
  diveScroll: 0.8,
  crossfade: 0.08,
  connectors: [],                /* one continuous take — the legs ARE the journey */
  sections: [
    {
      id: 'brief', label: 'The Brief',
      still: STILL(1),
      clip:  CLIP(1),
      clipMobile: H264 ? '/static/public/world/leg1-m.mp4' + V : undefined,
      accent: '#B87B33',
      scroll: 0.9, linger: 0.2,
      eyebrow: 'Measure 01 · The Brief',
      title: 'Every score starts as a spark.',
      body: 'Tell us the film, the brand, the feeling. One page, no jargon — a structured brief turns your idea into something a studio can act on.',
      tags: ['Scope', 'References', 'Deadlines'],
    },
    {
      id: 'estimate', label: 'The Number',
      still: STILL(2),
      clip:  CLIP(2),
      clipMobile: H264 ? '/static/public/world/leg2-m.mp4' + V : undefined,
      accent: '#5A7A96',
      eyebrow: 'Measure 02 · The Estimate',
      title: 'A number you can take to procurement.',
      body: 'Before a note is written you hold a real quote — scoped, itemized, usage and territory spelled out. One number, signed.',
      tags: ['Itemized', 'Usage · Term · Territory'],
    },
    {
      id: 'session', label: 'The Session',
      still: STILL(3),
      clip:  CLIP(3),
      clipMobile: H264 ? '/static/public/world/leg3-m.mp4' + V : undefined,
      accent: '#C05B4D',
      scroll: 0.9, linger: 0.2,
      eyebrow: 'Measure 03 · The Session',
      title: 'Real rooms. Real players.',
      body: 'Versions land in your session room the day they’re cut, synced against your picture. Human-made, always — never AI-generated audio.',
      tags: ['Human-made', 'Synced to picture'],
    },
    {
      id: 'clearance', label: 'Clearance',
      still: STILL(4),
      clip:  CLIP(4),
      clipMobile: H264 ? '/static/public/world/leg4-m.mp4' + V : undefined,
      accent: '#5E8A5C',
      eyebrow: 'Measure 04 · Review & Clearance',
      title: 'Every note cleared.',
      body: 'Timecoded notes, cue-by-cue sign-off, documented chain of title. Certified before it ships — rights nobody can take back.',
      tags: ['Chain of title', 'Clearance certificate'],
    },
    {
      id: 'delivery', label: 'Delivery',
      still: STILL(5),
      clip:  CLIP(5),
      clipMobile: H264 ? '/static/public/world/leg5-m.mp4' + V : undefined,
      accent: '#E4671F',
      scroll: 1.0, linger: 0.25,
      eyebrow: 'Measure 05 · The Delivery',
      title: 'Delivered like you’ve never seen.',
      body: 'Masters, stems, cutdowns, metadata, licensing docs — named and organized the same way, every time. Broadcast-ready the moment it lands.',
      tags: [],
      cta: { primary:  { label: 'Start your brief', href: '/start' },
             secondary: { label: 'Book a call',     href: '/book'  } },
    },
  ],
});
</script>
</body>
</html>

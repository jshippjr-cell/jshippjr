<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Reel — Chordential</title>
<link rel="stylesheet" href="/static/public/site.css?v={{ asset_v }}">
<link rel="icon" href="/static/public/wordmark-dark.png">
</head>
<body class="rg-body">
  {% include "public/_intro_gate.html" %}
  <!-- Pure-CSS carousel/list toggle (no JS) — same checkbox-hack pattern already
       used for the mobile menu in public_base.html. -->
  <input type="checkbox" id="rg-view-toggle" class="rg-view-input">

  <header class="rg-chrome">
    <a class="rg-logo" href="/"><img src="/static/public/wordmark-dark.png" alt="Chordential"></a>
    <label for="rg-view-toggle" class="rg-toggle">
      <span class="rg-toggle-spiral">carousel</span>
      <span class="rg-toggle-dot" aria-hidden="true">&#9679;</span>
      <span class="rg-toggle-list">list</span>
    </label>
    <a class="rg-menu" href="/for-artists">menu &#183;</a>
  </header>

  <main class="rg-stage">
    <div class="rg-drum" id="rg-drum">
      {% for c in cards %}
      <a class="rg-card rg-{{ c.gradient }}" href="{{ c.href }}"
         style="--slot-angle:{{ (loop.index0 * 360 / cards|length) }}deg"
         {% if c.audio_url %}data-audio-url="{{ c.audio_url }}"{% endif %}
         data-title="{{ c.title }}" data-label="{{ c.label }}">
        <span class="rg-card-kind">&#9654; play</span>
        <span class="rg-card-title">{{ c.title }}</span>
        <span class="rg-card-label">{{ c.label }}</span>
        <span class="rg-card-shine" aria-hidden="true"></span>
      </a>
      {% endfor %}
    </div>
    <p class="rg-hint rg-hint-desktop" aria-hidden="true">Scroll to spin faster &#183; click a track to play it</p>
    <p class="rg-hint rg-hint-touch" aria-hidden="true">Drag to look around &#183; click a track to play it</p>
  </main>

  <!-- Docked player — reuses the exact showreel player styling (.sr-*), shown
       once a track card is active. -->
  <div class="sr-player" data-rg-player>
    <button type="button" class="sr-btn" data-rg-toggle aria-label="Play/pause">
      <span class="sr-icon sr-icon-play" aria-hidden="true">&#9654;</span>
      <span class="sr-icon sr-icon-pause" aria-hidden="true">&#10073;&#10073;</span>
    </button>
    <button type="button" class="sr-btn" data-rg-prev aria-label="Previous">&#8249;</button>
    <button type="button" class="sr-btn" data-rg-next aria-label="Next">&#8250;</button>
    <div class="sr-meta">
      <span class="sr-track-title" data-rg-title></span>
      <input type="range" class="sr-scrub" data-rg-scrub min="0" max="1000" value="0" aria-label="Seek">
    </div>
  </div>
  <audio data-rg-audio preload="none" loop></audio>

  <div class="rg-foot">
    <span class="rg-foot-eyebrow">showreel</span>
    <span class="rg-foot-dot">&#183;</span>
    <span class="rg-foot-year">2026</span>
    <span class="rg-foot-dot">&#183;</span>
    <a class="rg-foot-cases" href="/capabilities">case studies</a>
  </div>

  <script src="/static/public/reel-carousel.js?v=4"></script>
</body>
</html>
